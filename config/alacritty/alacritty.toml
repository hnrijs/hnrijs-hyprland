[window]
opacity = 1
blur = true
padding = { x = 10, y = 10 }
dynamic_padding = true

[font]
size = 14.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"



[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"




[colors.normal]
black   = "#15161e"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

[colors.bright]
black   = "#444b6a"
blue    = "#7da6ff"
cyan    = "#0db9d7"
green   = "#b9f27c"
magenta = "#bb9af7"
red     = "#ff7a93"
white   = "#acb0d0"
yellow  = "#ff9e64"
